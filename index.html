<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>console</title>
<meta name="description" content="コマンドを打つとゲームが生成される、ターミナル風ミニゲーム集">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="term">
  <div id="out"></div>
  <div id="line"><span id="prompt">guest@console:~$</span>
    <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></div>
</div>
<canvas id="noise"></canvas>
<div id="game">
  <button id="back" type="button" tabindex="-1">← console に戻る (Esc)</button>
  <canvas id="cv"></canvas>
  <div id="hint"></div>
</div>

<!-- 共通基盤 -->
<script src="js/core.js"></script>
<script src="js/sfx.js"></script>
<!-- ゲーム (1本1ファイル。増やすときはここに1行足す) -->
<script src="js/games/tetris.js"></script>
<script src="js/games/snake.js"></script>
<script src="js/games/breakout.js"></script>
<script src="js/games/shooter.js"></script>
<script src="js/games/tictactoe.js"></script>
<script src="js/games/maze.js"></script>
<script src="js/games/2048.js"></script>
<script src="js/games/minesweeper.js"></script>
<script src="js/games/pong.js"></script>
<script src="js/games/flappy.js"></script>
<script src="js/games/typing.js"></script>
<script src="js/games/memory.js"></script>
<!-- コンソール本体 (最後に読み込む) -->
<script src="js/console.js"></script>
</body>
</html>
